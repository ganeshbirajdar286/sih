apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: swasthya
  labels:
    app: backend
    app.kubernetes.io/part-of: swasthya
type: Opaque
stringData:
  # Replace these placeholder values with your real production secrets
  JWT_SECRET: "replace_with_a_secure_random_jwt_secret"
  GROQ_API_KEY: "replace_with_your_groq_api_key"
  CLOUDINARY_CLOUD_NAME: "replace_with_your_cloudinary_cloud_name"
  CLOUDINARY_API_KEY: "replace_with_your_cloudinary_api_key"
  CLOUDINARY_API_SECRET: "replace_with_your_cloudinary_api_secret"
  MONGODB_URL: "mongodb+srv://<username>:<password>@cluster.mongodb.net/swasthya?retryWrites=true&w=majority"
  DODO_PAYMENTS_API_KEY: "replace_with_your_dodo_payments_api_key"
  BREVO_API_KEY: "replace_with_your_brevo_api_key"
  BREVO_VERIFIED_SENDER: "sender@example.com"
