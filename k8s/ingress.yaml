apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swasthya-ingress
  namespace: swasthya
  labels:
    app.kubernetes.io/part-of: swasthya
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # Route backend API calls
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3009
          # Route WebSocket / Socket.IO connections
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3009
          # Route backend healthcheck
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 3009
          # Route frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
