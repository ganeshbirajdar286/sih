apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: swasthya
  labels:
    app: redis
    app.kubernetes.io/part-of: swasthya
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Alias service named 'redis' for backwards-compatibility with docker-compose DNS
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: swasthya
  labels:
    app: redis
    app.kubernetes.io/part-of: swasthya
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
